[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "hephestus-agent"
version = "2.0.0"
description = "Supervised local LLM security research with local or encrypted remote execution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "click==8.5.0",
  "rich==15.0.0",
  "PyYAML==6.0.3",
  "Flask==3.1.3",
  "cryptography==50.0.0",
  "llama-cpp-python==0.3.36",
  "reportlab==4.2.5",
]

[project.scripts]
hephestus = "hephestus.web.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["hephestus"]

[tool.hatch.build.targets.wheel.force-include]
"hephestus/worker/remote_handler.ps1" = "hephestus/worker/remote_handler.ps1"

[tool.hatch.build.targets.sdist]
include = ["hephestus/", "models/README.md", "setup.py", "start_hephestus.py", "web.py", "relay.py", "config.example.yaml", "requirements.txt", "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs/", ".gitignore"]
