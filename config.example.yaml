# Copy to config.yaml; paths here resolve relative to this file.
llm:
  model: models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
  max_tokens: 640
  temperature: 0.45
  top_p: 0.9
  context_size: 8192
  gpu_layers: 0       # CPU; -1 asks a GPU-enabled build to offload all layers.
  threads: 4
  batch_size: 512
  chat_format: ""    # Empty uses GGUF chat metadata; set only for a known template.
runtime:
  backend: local     # local executes on your host; ssh executes on a verified peer.
  dry_run: true
  log_dir: logs
  max_steps: 15
  timeout_seconds: 0 # Zero disables the overall deadline.
  command_timeout_seconds: 120
  max_context_tokens: 5000
  output_max_chars: 32000
  max_repeated_failures: 3
  target_os: auto
  require_supervisor_approval: true
policy:
  max_command_length: 4000
  max_violations: 3
  allowlist: []       # Regex screening only; never a shell sandbox.
  # Omit denylist and blocked_primitives to retain the built-in defaults.
ssh:
  host: ""
  port: 22
  username: ""
  key_path: ""       # Empty uses your SSH agent/local key discovery.
  known_hosts: ""    # Empty uses system known_hosts; unknown peers are rejected.
  timeout_seconds: 30
